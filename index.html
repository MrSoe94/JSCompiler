<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Playground Interaktif</title>
    <!-- Memuat Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Konfigurasi Tailwind untuk menggunakan font Inter -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6', // blue-500
                        secondary: '#1f2937', // gray-800 for dark background
                        background: '#f3f4f6', // gray-100
                    }
                }
            }
        }
    </script>
    <style>
        /* Gaya kustom untuk memastikan area teks mengisi ruang dengan baik */
        .editor-container {
            display: grid;
            grid-template-rows: 1fr; 
            /* Menyesuaikan tinggi, memberikan sedikit ruang di atas dan bawah */
            min-height: calc(100vh - 8rem);
        }
        /* Menggunakan font monospace untuk kode */
        textarea, #output {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        /* Gaya khusus untuk scrollbar yang lebih halus (webkKit only) */
        textarea::-webkit-scrollbar, #output::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        textarea::-webkit-scrollbar-thumb, #output::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* gray-600 */
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-track, #output::-webkit-scrollbar-track {
            background-color: #1f2937; /* gray-800 */
        }
    </style>
</head>
<body class="bg-background font-sans p-4 sm:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-6 flex items-end justify-between border-b-2 border-primary pb-3">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900">
                    <span class="text-primary">JS</span> Live Playground
                </h1>
                <p class="text-gray-600 mt-1">Editor Kode Interaktif dengan Output Konsol Real-time.</p>
            </div>
            <!-- Tombol "Jalankan Kode" dipindahkan ke header untuk layout yang lebih bersih -->
            <button id="runButton"
                    class="px-6 py-2 bg-primary text-white font-semibold rounded-xl shadow-lg hover:bg-blue-600 transition duration-200 ease-in-out transform hover:scale-[1.02] active:scale-95 focus:outline-none focus:ring-4 focus:ring-primary focus:ring-opacity-50 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Jalankan
            </button>
        </header>

        <div class="editor-container grid grid-cols-1 lg:grid-cols-2 gap-4">

            <!-- Area Input Kode JavaScript (Tema Gelap) -->
            <div class="flex flex-col bg-secondary shadow-xl rounded-xl border border-gray-700 overflow-hidden">
                <div class="bg-gray-800 p-3 border-b border-gray-700">
                    <h2 class="font-bold text-sm uppercase tracking-wider text-primary">Kode JavaScript (ES6)</h2>
                </div>
                <textarea id="jsCode" class="flex-grow p-4 resize-none border-0 focus:ring-0 text-gray-200 bg-secondary placeholder-gray-500"
                          placeholder="Tulis kode JavaScript Anda di sini..."
                          rows="15">
// Contoh Kode JavaScript: Coba ubah angka di bawah!
const data = [
    { nama: 'Budi', skor: 95 },
    { nama: 'Ani', skor: 88 },
    { nama: 'Dedi', skor: 72 }
];

const rataRata = data.reduce((sum, item) => sum + item.skor, 0) / data.length;

console.log('Data Peserta:', data);
console.log('Rata-rata Skor:', rataRata.toFixed(2));

if (rataRata > 85) {
    console.log('%cKinerja Tim Baik!', 'color: lightgreen; font-weight: bold;');
} else {
    console.log('%cPerlu peningkatan skor!', 'color: yellow;');
}
</textarea>
            </div>

            <!-- Area Output dan Console (Tema Gelap) -->
            <div class="flex flex-col bg-secondary shadow-xl rounded-xl border border-gray-700 overflow-hidden">
                <div class="bg-gray-800 p-3 border-b border-gray-700">
                    <h2 class="font-bold text-sm uppercase tracking-wider text-primary">Output Konsol</h2>
                </div>
                <!-- Area untuk menampilkan output console.log dan error -->
                <div id="output" class="flex-grow p-4 bg-gray-900 text-white overflow-auto whitespace-pre-wrap">
                    <div class="text-gray-500">
                        Siap menjalankan kode. Output akan muncul di sini.
                        <br>
                        (Contoh di atas akan otomatis dijalankan saat Anda menekan tombol.)
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const jsCodeArea = document.getElementById('jsCode');
        const outputDiv = document.getElementById('output');
        const runButton = document.getElementById('runButton');

        // Menyimpan fungsi console.log asli
        const originalConsoleLog = console.log;

        // Fungsi untuk membersihkan output dan menampilkan pesan log
        function logOutput(...args) {
            // Konversi semua argumen menjadi string yang bisa dibaca
            const message = args.map(arg => {
                if (typeof arg === 'object' && arg !== null) {
                    try {
                        // Mencoba JSON.stringify dengan indentasi untuk objek
                        return JSON.stringify(arg, null, 2);
                    } catch (e) {
                        return String(arg);
                    }
                }
                return String(arg);
            }).join(' ');

            const logEntry = document.createElement('div');
            // Menangani formatting console.log bawaan browser
            if (typeof args[0] === 'string' && args[0].includes('%c')) {
                // Untuk kasus console.log('%c...','style')
                const parts = args[0].split('%c');
                logEntry.textContent = parts[0] + parts.slice(1).join('');
                logEntry.style = args.slice(1).join(' ');
            } else {
                logEntry.textContent = message;
            }

            logEntry.className = 'text-green-400 mb-1 border-l-2 border-green-500 pl-2 text-sm';
            outputDiv.appendChild(logEntry);

            // Scroll ke bawah secara otomatis
            outputDiv.scrollTop = outputDiv.scrollHeight;

            // Panggil console.log asli untuk logging di browser console juga
            originalConsoleLog(...args);
        }

        // Fungsi untuk menampilkan pesan error
        function displayError(e) {
            const errorEntry = document.createElement('div');
            errorEntry.innerHTML = `
                <strong class="text-red-500">RUNTIME ERROR:</strong> ${e.message}<br>
                <span class="text-gray-400 text-xs">Line: ${e.stack ? e.stack.split('<anonymous>')[1].split(':')[1] : 'Unknown'}</span>
            `;
            errorEntry.className = 'text-red-400 mb-1 border-l-2 border-red-500 pl-2 text-sm';
            outputDiv.appendChild(errorEntry);
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        // Fungsi utama untuk menjalankan kode
        function runCode() {
            // Hapus output sebelumnya
            outputDiv.innerHTML = '';
            // Tampilkan pesan loading
            outputDiv.innerHTML = '<div class="text-primary animate-pulse">Running code...</div>';

            const code = jsCodeArea.value;

            // Ganti fungsi console.log bawaan dengan fungsi custom
            console.log = logOutput;

            // Timeout singkat untuk membiarkan UI refresh pesan loading
            setTimeout(() => {
                outputDiv.innerHTML = ''; // Hapus pesan loading

                try {
                    // Jalankan kode menggunakan Function constructor
                    new Function(code)();
                } catch (e) {
                    // Tangani error yang terjadi selama eksekusi
                    displayError(e);
                } finally {
                    // Kembalikan console.log ke fungsi asli setelah eksekusi
                    console.log = originalConsoleLog;
                    if (outputDiv.children.length === 0) {
                        outputDiv.innerHTML = '<div class="text-gray-500">Kode berhasil dieksekusi, tetapi tidak ada output konsol yang ditemukan.</div>';
                    }
                }
            }, 50); // Delay 50ms
        }

        // Event listener untuk tombol "Jalankan Kode"
        runButton.addEventListener('click', runCode);

        // Tambahkan event listener untuk Ctrl+Enter atau Cmd+Enter
        jsCodeArea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault(); // Mencegah baris baru
                runCode();
            }
        });

        // Jalankan kode saat tombol ditekan
        document.addEventListener('DOMContentLoaded', () => {
             // runCode(); // Menjalankan kode contoh saat dimuat
        });

        // Tampilkan pesan awal yang lebih bersih
        outputDiv.innerHTML = '<div class="text-gray-500 text-sm">Siap menjalankan kode. Output akan muncul di sini. (Tips: Gunakan Ctrl+Enter atau Cmd+Enter untuk eksekusi cepat)</div>';

    </script>
</body>
</html>
